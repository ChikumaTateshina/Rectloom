# Publishes the VPM repository page and its listing.
#
# Pages is deployed only from the default branch. GitHub's own protection rule on
# the github-pages environment allows nothing else, so a tag-triggered deploy is
# rejected. That is why the release workflow builds and attaches the zips while
# this one publishes the listing that points at them.
#
# The listing is built from the packages on this branch, merged over whatever is
# already published, and a version is listed only once its zip can actually be
# downloaded. So a push that bumps a version ahead of its release changes nothing,
# and the listing can never advertise a download that answers 404.
#
# GitHub Pages must be set to deploy from GitHub Actions:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'Website/**'
      - 'Packages/*/package.json'
      - '.github/scripts/build_vpm_listing.py'
      - '.github/workflows/pages.yml'
  # Runs after a release has attached its zips, so the new version becomes
  # downloadable and therefore listable.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the page and listing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the listing
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          name="${GITHUB_REPOSITORY##*/}"
          published="https://${owner}.github.io/${name}/index.json"

          mkdir -p site
          cp Website/index.html site/

          if curl -fsSL --max-time 30 "$published" -o /tmp/published.json; then
            existing=(--existing /tmp/published.json)
          else
            # The URL has to be a valid listing from the moment the page is live. A
            # client that fetches a 404 reports the repository as invalid, which
            # reads as a broken link rather than "nothing released yet".
            echo "::notice::Nothing is published yet; starting a fresh listing."
            existing=()
          fi

          python .github/scripts/build_vpm_listing.py \
            --repo "$GITHUB_REPOSITORY" \
            --out site \
            --no-zip \
            --verify \
            --overwrite \
            "${existing[@]}"

      - name: Show what will be published
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          listing = json.load(open("site/index.json"))

          for name, package in sorted(listing["packages"].items()):
              versions = sorted(package.get("versions", {}))
              print(f"{name}: {', '.join(versions) if versions else 'no versions yet'}")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
