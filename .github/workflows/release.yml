# Builds the package zips and attaches them to a GitHub release.
#
# Triggered by pushing a tag such as v0.1.0, or run by hand with a version.
#
# It deliberately does not touch GitHub Pages. Pages is deployed only from the
# default branch -- GitHub's protection rule on the github-pages environment
# rejects anything else, including a tag -- so the Pages workflow publishes the
# listing once this one has made the zips downloadable. It runs automatically
# after this workflow completes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    name: Build the package zips
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the package layout
        run: python .github/scripts/validate_packages.py

      - name: Check that the packages carry the release version
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.value }}"
          status=0
          for manifest in Packages/*/package.json; do
            actual=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$manifest")
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$manifest::version is $actual but the release is $expected"
              status=1
            fi
          done
          exit $status

      # Only the zips matter here. The listing that points at them is published from
      # the default branch, by the Pages workflow.
      - name: Build the zips
        run: |
          python .github/scripts/build_vpm_listing.py \
            --repo "$GITHUB_REPOSITORY" \
            --version "${{ steps.version.outputs.value }}" \
            --out Website

      - uses: actions/upload-artifact@v4
        with:
          name: package-zips
          path: Website/*.zip

      - name: Attach the zips to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Website/*.zip \
            --title "Rectloom ${{ steps.version.outputs.value }}" \
            --notes-file CHANGELOG.md \
            || gh release upload "${GITHUB_REF_NAME}" Website/*.zip --clobber
